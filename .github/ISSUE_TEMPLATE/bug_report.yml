name: Bug report
description: Something failed in the notebook or the local run
labels: [bug]
body:
  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail?
      options:
        - Build stable-diffusion.cpp
        - Download
        - Quantize
        - Test image
        - Running locally
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Paste the error output.
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Kaggle or local OS, RAM, stable-diffusion.cpp version or commit
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config changes
      description: Any variables you changed in the config cell
